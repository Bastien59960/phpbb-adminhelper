services:
    # Surcharge du cron_runner_listener phpBB core pour garantir la libération
    # du cron_lock (DB) via try-finally même si run() lève une exception.
    # Remplace le service core 'cron.event_listener' (phpbb\cron\event\cron_runner_listener).
    cron.event_listener:
        class: bastien59960\adminhelper\cron\safe_cron_runner_listener
        arguments:
            - '@cron.lock_db'
            - '@cron.manager'
            - '@request'
        tags:
            - { name: kernel.event_subscriber }

    bastien59960.adminhelper.listener:
        class: bastien59960\adminhelper\event\listener
        arguments:
            - '@dbal.conn'
            - '@request'
            - '@template'
            - '@language'
            - '@auth'
            - '@user'
            - '@config'
            - '@bastien59960.adminhelper.attachment_ai_manager'
            - '%core.table_prefix%'
        tags:
            - { name: event.listener }

    bastien59960.adminhelper.console.attachment_ai_scan:
        class: bastien59960\adminhelper\console\attachment_ai_scan
        arguments:
            - '@user'
            - '@bastien59960.adminhelper.attachment_ai_manager'
        tags:
            - { name: console.command }

    bastien59960.adminhelper.attachment_ai_manager:
        class: bastien59960\adminhelper\service\attachment_ai_manager
        arguments:
            - '@dbal.conn'
            - '@config'
            - '%core.root_path%'
            - '%core.table_prefix%'

    bastien59960.adminhelper.mod_notes:
        class: bastien59960\adminhelper\controller\mod_notes_controller
        arguments:
            - '@dbal.conn'
            - '@auth'
            - '@user'
            - '@template'
            - '@language'
            - '@request'
            - '@controller.helper'
            - '%core.table_prefix%'
