	border-top: 1px dashed #d9d9d9;
}
.adminhelper-ai-attach-control label {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	font-weight: 600;
}
.adminhelper-ai-attach-control input[disabled] + span {
	opacity: 1;
}
.adminhelper-ai-attach-status {
	display: block;
	margin-top: 3px;
	font-size: 11px;
	color: #9a5c00;
}
